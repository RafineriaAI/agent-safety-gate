name: agent-safety-gate CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Pinned from actions/checkout@v4.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # Pinned from actions/setup-python@v5.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev,mcp]"

      # The interop test runs against the real kernel, not the vendored copy.
      # Without it that test skips, which would hide a broken claim.
      - name: Install the AOS kernel for the interop test
        run: python -m pip install "aos-kernel @ git+https://github.com/RafineriaAI/aos-kernel@v0.1.1"

      - name: Check the vendored kernel against upstream bytes
        run: |
          git clone --depth 1 --branch v0.1.1 https://github.com/RafineriaAI/aos-kernel.git "$RUNNER_TEMP/aos-kernel"
          AOS_KERNEL_REPO="$RUNNER_TEMP/aos-kernel" python tools/check_vendor.py

      # ubuntu-latest ships Google Chrome; the browser tests need it and are
      # not allowed to skip here.
      - name: Confirm a headless browser is available
        run: google-chrome --version

      - name: Verify everything
        run: bash tools/verify_all.sh
