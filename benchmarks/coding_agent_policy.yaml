# A careful operator's first cut at a policy for a coding agent, written for the
# tool surface Claude Code actually exposes: read, search, write, edit, shell.
#
# It is used by benchmarks/session_replay.py against a real session. The point
# of that benchmark is not to make this policy look good - it is to find out how
# often a reasonable first attempt gets in the way of work that was fine.
#
# Demonstration defaults, as everywhere else here. See BOUNDARY.md.

policy_id: coding_agent_first_cut
policy_version: "1.0.0"

thresholds:
  limit: 7000
  warn_margin: 2000

weights:
  action_class:
    read_only: 1000
    reversible_write: 2000
    irreversible: 4000
    external_effect: 4000
  scope_mismatch: 4500
  approval_missing: 3500

uncertainty:
  policy_coverage_absent: 5500
  scope_unmeasured: 1500
  unknown_tool_extra: 2000

unknown_tool: warn
record_arguments: full
approvals_dir: .agent-safety-gate/approvals

tools:
  # Reading anywhere in the workspace is fine; reading outside it is not
  # something the operator wants to happen silently.
  Read:
    action_class: read_only
    scope:
      argument: file_path
      allow_path_prefixes:
        [src/, tests/, tools/, benchmarks/, examples/, verifier/, docs/, .github/]

  Glob:
    action_class: read_only

  Grep:
    action_class: read_only

  # Edits are reversible - the repository is under version control - but only
  # inside the tree the agent was given.
  Write:
    action_class: reversible_write
    scope:
      argument: file_path
      allow_path_prefixes:
        [src/, tests/, tools/, benchmarks/, examples/, verifier/, docs/, .github/]

  Edit:
    action_class: reversible_write
    scope:
      argument: file_path
      allow_path_prefixes:
        [src/, tests/, tools/, benchmarks/, examples/, verifier/, docs/, .github/]

  # A shell is a tool that can do anything, so the only honest class for it is
  # the worst thing it can do. This is the line that dominates the result, and
  # benchmarks/README.md explains why that is a finding rather than a setting to
  # tune away.
  Bash:
    action_class: irreversible

  # Bookkeeping tools that change nothing outside the agent's own task list.
  TaskCreate:
    action_class: reversible_write
  TaskUpdate:
    action_class: reversible_write

  ToolSearch:
    action_class: read_only

  # Asking a human is the opposite of an unaudited path.
  AskUserQuestion:
    action_class: read_only
